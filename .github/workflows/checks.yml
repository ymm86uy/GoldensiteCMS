name: Comprobaciones de Comercial
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: goldensite_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo, curl, gd, zip, openssl, dom
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer dump-autoload --optimize --strict-ambiguous
      - run: composer audit --locked --no-interaction
      - run: php tools/verify-source.php
      - run: php tools/audit.php
      - run: php tests/run.php
      - name: Comprobar migraciones y respaldo consistente
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci_consolidation
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=goldensite_test_ci","root",getenv("DB_PASS")); $db->exec("CREATE DATABASE goldensite_test_ci_consolidation CHARACTER SET utf8mb4");'
          php tests/consolidation-schema.php
      - name: Preparar instalación de prueba
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/commercial.zip" HEAD
          zip -q -d "$RUNNER_TEMP/commercial.zip" storage/
          zip -q -r -D "$RUNNER_TEMP/commercial.zip" vendor -x 'vendor/*/tests/*' 'vendor/*/test/*' 'vendor/*/examples/*' 'vendor/*/example/*' 'vendor/*/README*' 'vendor/*/CHANGELOG*'
      - name: Comprobar instalación y restricciones de edición
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci
          GOLDENSITE_TEST_ACCESS_RECOVERY: '1'
          GOLDENSITE_INSTALL_TEST_PORT: '18084'
        run: php tests/install.php "$RUNNER_TEMP/commercial.zip"
      - name: Comprobar licencia e historial privado de auditoría
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci_audit
          GOLDENSITE_TEST_SECURITY_AUDIT: '1'
          GOLDENSITE_INSTALL_TEST_PORT: '18085'
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=goldensite_test_ci","root",getenv("DB_PASS")); $db->exec("CREATE DATABASE goldensite_test_ci_audit");'
          php tests/install.php "$RUNNER_TEMP/commercial.zip"
      - name: Comprobar chat ante fallo de almacenamiento
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci_chat
          GOLDENSITE_TEST_CHAT_CONSOLIDATION: '1'
          GOLDENSITE_INSTALL_TEST_PORT: '18086'
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=goldensite_test_ci","root",getenv("DB_PASS")); $db->exec("CREATE DATABASE goldensite_test_ci_chat CHARACTER SET utf8mb4");'
          php tests/install.php "$RUNNER_TEMP/commercial.zip"



      - name: Comprobar referencia firmada e integridad en instalación de CI
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci_integrity
          GOLDENSITE_TEST_RELEASE_INTEGRITY: '1'
          GOLDENSITE_TEST_INTEGRITY_REPACKED: '1'
          GOLDENSITE_INSTALL_TEST_PORT: '18087'
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=goldensite_test_ci","root",getenv("DB_PASS")); $db->exec("CREATE DATABASE goldensite_test_ci_integrity CHARACTER SET utf8mb4");'
          php tests/install.php "$RUNNER_TEMP/commercial.zip"
      - name: Comprobar observación CSP local y privacidad
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci_csp
          GOLDENSITE_TEST_CSP_REPORTS: '1'
          GOLDENSITE_INSTALL_TEST_PORT: '18088'
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=goldensite_test_ci","root",getenv("DB_PASS")); $db->exec("CREATE DATABASE goldensite_test_ci_csp CHARACTER SET utf8mb4");'
          php tests/install.php "$RUNNER_TEMP/commercial.zip"
      - name: Comprobar estudio guiado, publicación y recuperación
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ci-only-password
          GOLDENSITE_TEST_DB: goldensite_test_ci_studio
          GOLDENSITE_TEST_GUIDED_STUDIO: '1'
          GOLDENSITE_INSTALL_TEST_PORT: '18089'
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=goldensite_test_ci","root",getenv("DB_PASS")); $db->exec("CREATE DATABASE goldensite_test_ci_studio CHARACTER SET utf8mb4");'
          php tests/install.php "$RUNNER_TEMP/commercial.zip"
